services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checklist
      POSTGRES_USER: checklist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checklist-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checklist -d checklist"]
      interval: 3s
      timeout: 3s
      retries: 30
  storage:
    image: chrislusf/seaweedfs:4.51
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-checklist-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-checklist-storage-local-only}
      S3_BUCKET: checklist-photos
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["storage-data:/data"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://checklist:${POSTGRES_PASSWORD:-checklist-local-only}@db:5432/checklist
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-before-deploy-728fa914}
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_PREFIX: /storage
      S3_REGION: us-east-1
      S3_BUCKET: checklist-photos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-checklist-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-checklist-storage-local-only}
      NODE_ENV: production
      SEED_DEMO: 'true'
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
    ports: ["127.0.0.1:3001:3001"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  postgres-data:
  storage-data:
